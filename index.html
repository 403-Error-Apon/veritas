<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f4">
  <meta name="description" content="A focused study workspace for Year 1, Semester 2 criminology courses.">
  <title>Study Desk · Year 1 Semester 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview" aria-label="Study Desk home">
        <span class="brand-icon"><span></span><span></span><span></span></span>
        <span class="brand-name">study desk<small>YEAR 1 · SEMESTER 2</small></span>
      </a>

      <div class="side-label">YOUR COURSES</div>
      <nav class="course-list" id="course-list" aria-label="Courses"></nav>

      <div class="side-divider"></div>
      <nav class="section-nav" id="section-nav" aria-label="Course and study tools"></nav>

      <div class="sidebar-bottom">
        <div class="semester-credit"><span>SEMESTER LOAD</span><strong>20 <small>credits</small></strong></div>
        <div class="sidebar-note">5 courses <span>·</span> 4 credits each</div>
      </div>
    </aside>
    <button class="sidebar-shade" id="sidebar-shade" aria-label="Close course navigation"></button>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open course navigation">☰</button>
        <div class="breadcrumb"><span>Year 1</span><i>/</i><span>Semester 2</span><i>/</i><strong id="breadcrumb-course">Introduction to Policing</strong></div>
        <div class="topbar-tools">
          <label class="search-box" for="global-search"><span class="search-icon">⌕</span><input id="global-search" type="search" placeholder="Search this course" autocomplete="off"><kbd>/</kbd></label>
        </div>
      </header>

      <div class="page-scroll">
        <div class="page-content" id="page-content" aria-live="polite"></div>
      </div>
    </main>
  </div>

  <div class="search-backdrop hidden" id="search-backdrop">
    <div class="search-results-panel" role="dialog" aria-modal="true" aria-label="Search study materials">
      <div class="search-panel-head"><strong>Search study materials</strong><button id="close-search" aria-label="Close search">Esc</button></div>
      <input id="search-modal-input" type="search" placeholder="Search notes, terms, dates and questions…" autocomplete="off">
      <div id="search-results" class="search-results"></div>
      <div class="search-hint">Search within the selected course</div>
    </div>
  </div>

  <script src="data/catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
